<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Python UNO Game</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Honk:MORF@15&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <h1 class="python-uno-title">Welcome To Python Uno!</h1>
    </header>

    <main>
      <div class="table-top"><h1>TOP</h1></div>
      <div class="table-left"><h1>LEFT</h1></div>
      <div class="table-center">
        <div class="card draw-deck" onclick="">
          <div class="rectangle">
            <h2 class="uno-title">UNO</h2>
          </div>
        </div>
        <div class="card">
          <img
            src="/static/images/Card Images/red_2.png"
            alt=""
            class="card-img"
          />
        </div>
      </div>
      <div class="table-right"><h1>RIGHT</h1></div>
      <div class="table-bottom">
        {% for card in player_hand %}
        <div class="card">
          <div class="card-inner">
            <div class="card-front">
              <img
                src="/static/images/Card Images/{{ card }}.png"
                class="card-img"
              />
            </div>
            <div class="card-back">
              <div class="rectangle">
                <h2 class="uno-title">UNO</h2>
              </div>
            </div>
          </div>
        </div>
        {% endfor %}
      </div>
    </main>
  </body>
</html>
